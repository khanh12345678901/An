<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime PC Doctor Sakura Edition</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#fff0f7,#ffd6ea,#ffeaf5);color:#4a2840}.hero{padding:40px;text-align:center}.card{background:#fff;border-radius:20px;padding:20px;margin:20px;box-shadow:0 10px 30px rgba(255,20,147,.15)}h1{color:#ff1493}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.item{background:#fff6fb;padding:15px;border-radius:15px;border:1px solid #ffd0e6}select{width:100%;padding:10px}#result{margin-top:15px;font-weight:bold}</style></head><body><div class="hero"><h1>🌸 Anime PC Doctor</h1><p>Phiên bản nâng cấp Sakura Edition</p></div><div class="card"><h2>CPU + VGA Analyzer</h2><select id="cpu"><option value="25000">i5 12400F</option><option value="55000">Ryzen 7 7800X3D</option><option value="58000">i9 14900K</option></select><br><br><select id="gpu"><option value="24000">RTX 3060</option><option value="50000">RTX 4070 Super</option><option value="100000">RTX 5090</option></select><br><br><button onclick="calc()">Phân tích</button><div id="result"></div></div><div class="card"><h2>VGA Hospital</h2><div class="grid"><div class="item">Black Screen → Cài lại driver bằng DDU.</div><div class="item">Artifact → Kiểm tra VRAM và nhiệt độ.</div><div class="item">FPS Drop → Theo dõi CPU/GPU Usage.</div><div class="item">Driver Crash → Cập nhật driver mới.</div></div></div><script>function calc(){let c=+cpu.value,g=+gpu.value;let b=Math.max(0,((g-c)/g)*100).toFixed(1);result.innerHTML='Nghẽn cổ chai 1080P: '+b+'%';}</script></body></html>
